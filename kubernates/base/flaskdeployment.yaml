apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaskdeployement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask-app
          image: shahiddevops1/flask-todo-app:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: db-host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: db-name

            # Postgres (RDS) connection string — mysql:// se postgresql:// wapas kiya,
            # aur db-service (local pod) ki jagah ab RDS host use ho raha hai
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"

            # Baqi ke env variables
            - name: SECRET_KEY
              value: "dev-secret-key-change-me"
            - name: SEED_ON_START
              value: "true"
            - name: ADMIN_EMAIL
              value: "admin@stockflow.local"
            - name: ADMIN_PASSWORD
              value: "Admin@12345"
