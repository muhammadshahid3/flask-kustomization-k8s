# ---------------------------------------------------------------------------
# Yeh ab sirf ek TEMPLATE hai — is file mein koi real password commit NAHI
# karna. Asal secret cluster mein manually banao, wahi password use karke
# jo tumne terraform.tfvars mein db_password = "..." set kiya tha:
#
#   kubectl create secret generic db-secret \
#     --namespace stock \
#     --from-literal=db-host="$(terraform output -raw rds_endpoint)" \
#     --from-literal=db-user="stockflow_admin" \
#     --from-literal=db-password="Apna-Wahi-Password" \
#     --from-literal=db-name="stockflow"
#
# (Command ek baar chalao, kustomization.yaml mein isay resource ki tarah
# add mat karo — nahi to woh khaali template wapas apply ho jayega.)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  db-host: "REPLACE_ME"      # terraform output rds_endpoint
  db-user: "stockflow_admin"
  db-password: "REPLACE_ME"  # wahi password jo terraform.tfvars mein diya tha
  db-name: "stockflow"
