apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Yeh line saare resources ko automatic is namespace mein daal degi
namespace: stock

# 2. Files ki list (Isme humne namespace ki file bhi jod di hai)
# db-secret.yaml resources mein SHAMIL NAHI kiya — woh khaali template hai.
# Asal secret `kubectl create secret ...` command se manually banega
# (dekho base/db-secret.yaml ke comments), taake real RDS password kabhi
# git mein commit na ho.
resources:
  - namespace.yaml # Jo sabse pehle banayi thi
  - flaskdeployment.yaml
  - flaskservice.yaml

commonLabels:
  app: stockflow-stack
