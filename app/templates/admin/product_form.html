{% extends "base.html" %}
{% block title %}{{ title }} - Admin{% endblock %}

{% block content %}
<h1 class="h3 mb-3">{{ title }}</h1>
{% include "admin/_nav.html" %}

<div class="card shadow-sm">
  <div class="card-body p-4">
    <form method="post" action="{{ action }}">
      {{ csrf_input() }}
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" required maxlength="200"
               value="{{ values.get('name', '') }}">
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="4">{{ values.get('description', '') }}</textarea>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label for="price" class="form-label">Price ($)</label>
          <input type="number" class="form-control" id="price" name="price" required min="0" step="0.01"
                 value="{{ values.get('price', '') }}">
        </div>
        <div class="col-md-4 mb-3">
          <label for="stock_quantity" class="form-label">Stock quantity</label>
          <input type="number" class="form-control" id="stock_quantity" name="stock_quantity" required min="0" step="1"
                 value="{{ values.get('stock_quantity', '0') }}">
        </div>
        <div class="col-md-4 mb-3">
          <label for="category_id" class="form-label">Category</label>
          <select class="form-select" id="category_id" name="category_id">
            <option value="">Uncategorized</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if values.get('category_id', '')|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label for="image_url" class="form-label">Image URL (optional)</label>
        <input type="text" class="form-control" id="image_url" name="image_url" maxlength="500"
               placeholder="https://example.com/photo.jpg" value="{{ values.get('image_url', '') }}">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save product</button>
        <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
