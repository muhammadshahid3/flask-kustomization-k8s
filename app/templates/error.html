{% extends "base.html" %}
{% block title %}{{ error.code }} - StockFlow{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-4 fw-bold">{{ error.code }}</h1>
  <p class="lead">{{ error.name }}</p>
  <p class="text-muted">{{ error.description }}</p>
  <a href="{{ url_for('products.index') }}" class="btn btn-primary">Back to home</a>
</div>
{% endblock %}
