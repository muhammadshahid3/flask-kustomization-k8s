{% extends "base.html" %}
{% block title %}Sign up - StockFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Create your account</h1>

        <form method="post" action="{{ url_for('auth.signup', next=request.args.get('next')) }}">
          {{ csrf_input() }}
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required maxlength="100" autofocus
                   value="{{ request.form.get('name', '') }}">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required maxlength="255"
                   value="{{ request.form.get('email', '') }}">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required minlength="8">
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8">
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
          Already have an account? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
